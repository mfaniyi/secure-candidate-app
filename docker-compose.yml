services:
  postgres:
    image: postgres:18
    container_name: secure_candidate_postgres
    environment:
      POSTGRES_DB: secure_candidate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_candidate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
